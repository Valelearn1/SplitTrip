# D-66: a ogni push su main girano i test del backend, del frontend e il giro end-to-end
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test (Testcontainers usa il Docker della macchina)
        working-directory: BE
        run: sh mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splittrip_e2e
          POSTGRES_USER: splittrip
          POSTGRES_PASSWORD: splittrip
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U splittrip"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Rapporto e tracce se il giro fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            FE/playwright-report
            FE/test-results
          retention-days: 7
