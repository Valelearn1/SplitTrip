spring.application.name=splittrip

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/splittrip}
spring.datasource.username=${DATABASE_USERNAME:splittrip}
spring.datasource.password=${DATABASE_PASSWORD:splittrip}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}
app.jwt.ttl=${JWT_TTL:PT24H}
app.cors.origin=${CORS_ORIGIN:http://localhost:5173}
app.ratelimit.auth.max-requests=10
app.ratelimit.auth.window=PT1M
app.ratelimit.auth.client-ip-header=${RATE_LIMIT_IP_HEADER:}

springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
app.photos.max-per-trip=200

app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=claude-haiku-4-5
