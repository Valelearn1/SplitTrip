services:
  db:
    image: postgres:16-alpine
    container_name: splittrip-db
    environment:
      POSTGRES_DB: splittrip
      POSTGRES_USER: splittrip
      POSTGRES_PASSWORD: splittrip
    ports:
      - "5432:5432"
    volumes:
      - splittrip-db:/var/lib/postgresql/data

volumes:
  splittrip-db:
