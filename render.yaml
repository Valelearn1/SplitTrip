databases:
  - name: splittrip-db
    plan: free
    databaseName: splittrip
    user: splittrip

services:
  - type: web
    name: splittrip-api
    runtime: docker
    plan: free
    rootDir: BE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splittrip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://splittrip-750q.onrender.com
      # Istanza free: 512 MB e CPU condivisa. Con -Xmx384m l'avvio di Hibernate si bloccava (14/10, deploy 6f38932):
      # heap più piccolo, un solo thread di GC e JIT leggero lasciano spazio a metaspace e thread (~310 MB in tutto)
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      # Davanti a Render c'è Cloudflare: l'IP vero del client arriva in questo header (non falsificabile dal client)
      - key: RATE_LIMIT_IP_HEADER
        value: CF-Connecting-IP
      # Consigli AI (D-41): il valore lo inserisce l'autrice nella dashboard di Render, mai nel repository
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password dimenticata (D-61): SMTP di Brevo; i valori li inserisce l'autrice nella dashboard, mai nel repository
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: splittrip
    runtime: static
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://splittrip-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # La CSP deve stare sulla pagina che contiene il JWT, cioè qui, non sulle risposte JSON dell'API
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-VFCtbqEYwoPkXMzQfNWIzvpUoO8JB5sLIKoodj/5qew='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://splittrip-api.onrender.com wss://splittrip-api.onrender.com; img-src 'self' data: blob: https://tile.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
