databases:
  - name: splittrip-db
    plan: free
    databaseName: splittrip
    user: splittrip

services:
  - type: web
    name: splittrip-api
    runtime: docker
    plan: free
    rootDir: BE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splittrip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://splittrip-750q.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m
      # Davanti a Render c'è Cloudflare: l'IP vero del client arriva in questo header (non falsificabile dal client)
      - key: RATE_LIMIT_IP_HEADER
        value: CF-Connecting-IP

  - type: web
    name: splittrip
    runtime: static
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://splittrip-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # La CSP deve stare sulla pagina che contiene il JWT, cioè qui, non sulle risposte JSON dell'API
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://splittrip-api.onrender.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
