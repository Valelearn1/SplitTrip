databases:
  - name: splittrip-db
    plan: free
    databaseName: splittrip
    user: splittrip

services:
  - type: web
    name: splittrip-api
    runtime: docker
    plan: free
    rootDir: BE
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splittrip-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://splittrip-750q.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m

  - type: web
    name: splittrip
    runtime: static
    rootDir: FE
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://splittrip-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
